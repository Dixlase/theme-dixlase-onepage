name: Deploy Theme

on:
  push:
    branches:
      - main

  # Manual entry point, for putting the built assets back on a site.
  #
  # This workflow is the only thing that produces
  # `themes/DixlaseOnePage/resources/assets/` on a site: the build output is
  # gitignored (#54), so neither a git checkout of this repository nor the
  # Composer archive of this theme carries it. A core deploy whose
  # `composer.lock` moves this theme replaces the theme directory from that
  # archive and the build goes with it (Dixlase/dixlase-core#539) — core's
  # re-adoption step restores `.git` and the tracked files, so the repair
  # reports success while the assets stay missing.
  #
  # Re-running a past run is not a substitute: it deploys *that run's*
  # commit, which rolls the deployed theme back to an older tree once `main`
  # has moved on. A dispatch runs at a ref chosen at start time, which is
  # what a recovery wants. The job is idempotent — vite builds with
  # `emptyOutDir`, and the server side is `rsync --delete` into the theme
  # tree followed by the symlink check.
  workflow_dispatch:

# One run at a time, for the whole workflow rather than per ref: every run
# rsyncs into the same path on the same server, so two runs of different
# refs collide exactly as two runs of the same ref do. (release.yml groups
# per ref because its runs write to different tags.)
#
# `cancel-in-progress: false` is the point of the group. Cancelling a run
# mid-rsync is what leaves a partial tree behind: `--delete` makes the
# destination match the source, so a destination caught mid-transfer is not
# a complete build, and the stylesheets and scripts are content-hashed —
# the page still returns 200 with the HTML unchanged while the assets 404.
# Queuing lets the first run finish and the second one then deploys the
# newer commit over a complete tree.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # The built assets are committed, covered by the theme's signature
      # and distributed as those exact bytes, so this runner neither needs
      # core and the plugins for Tailwind's scanner nor builds anything.
      # Each site's own fetch and hard-reset below brings the assets along
      # with the rest of the tree.
      - name: Checkout theme code
        uses: actions/checkout@v5

      - name: Check the built assets are in the tree
        run: |
          if [ ! -f resources/assets/manifest.json ]; then
            echo "::error::resources/assets/manifest.json is missing from this tree. The release has to build and commit the assets; refusing to deploy a tree without them." >&2
            exit 1
          fi
          echo "Built assets present: $(ls resources/assets | tr '\n' ' ')"

      - name: Set deploy target
        id: target
        run: |
          if [ "${{ github.repository }}" = "Dixlase/theme-dixlase-onepage" ]; then
            echo "env=production" >> $GITHUB_OUTPUT
            echo "base_dir=/srv/dixlase" >> $GITHUB_OUTPUT
          else
            echo "env=staging" >> $GITHUB_OUTPUT
            echo "base_dir=/srv/dixlase/staging" >> $GITHUB_OUTPUT
          fi

      - name: Deploy theme via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            BASE="${{ steps.target.outputs.base_dir }}"
            THEME_DIR="DixlaseOnePage"
            EXPECTED_URL="git@github.com:${{ github.repository }}.git"
            FAILED_SITES=""

            # Which repository a remote names, not how its URL is written.
            # `https://github.com/O/R.git` and `git@github.com:O/R.git` are
            # the same repository reached two ways, and a checkout made along
            # the Docker Installer path tends to carry the https form while
            # this workflow always expects the git@ one.
            normalize_repo_url() {
              printf '%s' "$1" \
                | sed -E 's#^[a-z+]+://##; s#^[^/@]+@##; s#^([^/:]+):[0-9]+/#\1/#; s#^([^/:]+):#\1/#; s#/+$##; s#\.git$##' \
                | tr '[:upper:]' '[:lower:]'
            }

            # A renamed repository keeps its old URL working, because GitHub
            # redirects it -- so a stale remote fetches successfully for months
            # and only a string comparison ever notices. Normalising cannot
            # resolve a rename, so ask both URLs for the same ref: the same
            # repository answers with the same tip, two different repositories
            # do not.
            same_repo_as_expected() {
              [ -n "$1" ] || return 1
              if [ "$(normalize_repo_url "$1")" = "$(normalize_repo_url "$EXPECTED_URL")" ]; then
                return 0
              fi
              _actual_tip=$(git ls-remote "$1" refs/heads/main 2>/dev/null | cut -f1)
              _expected_tip=$(git ls-remote "$EXPECTED_URL" refs/heads/main 2>/dev/null | cut -f1)
              [ -n "$_actual_tip" ] && [ "$_actual_tip" = "$_expected_tip" ]
            }

            # `keys` was renamed to `authority` (https://authority.dixlase.net/);
            # /var/www/apps/keys no longer exists in compose-php-1.
            for SITE in brand docs demo authority; do
              # Resolve the site layout. A Docker Installer instance keeps the app in
              # $BASE/$SITE/html and runs its own PHP container named after
              # CONTAINER_PREFIX in $BASE/$SITE/.env, with files owned by
              # deploy:www-data. The legacy shared stack mounts $BASE/$SITE into
              # compose-php-1 at /var/www/apps/$SITE, owned by deploy:deploy.
              if [ -f "$BASE/$SITE/docker-compose.yml" ] && [ -d "$BASE/$SITE/html" ]; then
                SITE_ROOT="$BASE/$SITE/html"
                APP_ROOT="/var/www/html"
                PREFIX=$(grep -E '^CONTAINER_PREFIX=' "$BASE/$SITE/.env" 2>/dev/null | cut -d= -f2)
                PHP_CONTAINER="${PREFIX:-dixlase-$SITE}-app"
                OWNER="1001:33"
                RUN_AS="-u www-data"
                # The installer keeps dev packages in vendor/, so an autoload map
                # built with --no-dev drops their service providers and every request
                # then fails in package discovery.
                NO_DEV=""
              else
                SITE_ROOT="$BASE/$SITE"
                APP_ROOT="/var/www/apps/$SITE"
                PHP_CONTAINER="compose-php-1"
                OWNER="1001:1001"
                RUN_AS=""
                NO_DEV="--no-dev"
              fi
              # Installer sites need group write too: www-data writes caches and the
              # deploy user's next rsync must be able to replace what it wrote.
              fix_owner() {
                docker exec "$PHP_CONTAINER" chown -R "$OWNER" "$@"
                if [ -n "$RUN_AS" ]; then docker exec "$PHP_CONTAINER" chmod -R g+rwX "$@"; fi
              }
              DEST="$SITE_ROOT/themes/$THEME_DIR"
              echo "=== Deploying theme $THEME_DIR to $SITE (${{ steps.target.outputs.env }}) ==="

              # Skip a site that is not set up (renamed, retired, or not yet
              # bind-mounted). Without this, a rename turns every later run
              # red at the artisan call and hides real failures — which is
              # exactly what `keys` did from 2026-09-16 on. Mirrors the same
              # guard in dixlase-core's deploy.yml.
              if [ ! -d "$SITE_ROOT" ]; then
                echo "  SKIP: host path $BASE/$SITE does not exist"
                continue
              fi
              if ! docker exec "$PHP_CONTAINER" test -f "$APP_ROOT/artisan"; then
                echo "  SKIP: $APP_ROOT/artisan not found in $PHP_CONTAINER"
                continue
              fi

              # themes ディレクトリがなければ作成
              mkdir -p "$SITE_ROOT/themes"

              # Move-aside copies must NOT live under themes/. The site's
              # scripts/sync-local-autoload.php globs themes/* and registers
              # every match as a theme, so a copy parked there gets its own
              # PSR-4 roots AND an autoload.files entry for its helper file.
              # Deleting such a copy then makes composer require() a file that
              # no longer exists — a fatal on every request and every artisan
              # call, not a degraded theme. Park them outside the glob instead,
              # and migrate any copy an older revision of this workflow left
              # behind so the next deploy self-heals.
              BACKUP_ROOT="$SITE_ROOT/.theme-backups"
              mkdir -p "$BACKUP_ROOT"
              for LEGACY in "$SITE_ROOT/themes/$THEME_DIR".stale.*; do
                [ -d "$LEGACY" ] || continue
                echo "  Migrating legacy copy out of themes/: $LEGACY"
                mv "$LEGACY" "$BACKUP_ROOT/$(basename "$LEGACY")"
              done

              # ------------------------------------------------------------------
              # Resolve $DEST into one of three shapes and act accordingly:
              #
              #   (a) Proper nested clone of this theme
              #       -> fetch + reset to origin/main
              #
              #   (b) Directory exists but with no nested .git
              #       -> likely the outer parent repo was re-cloned over it and
              #          the theme's git metadata was lost. Without this guard
              #          the next branch would silently fetch+reset against
              #          WHICHEVER repo the parent .git tracks (Core, usually),
              #          leaving theme files frozen forever -- same silent
              #          regression that hid in DixlaseInquiry from
              #          2026-05-13 to 2026-05-17.
              #          Move the stale tree aside (recoverable as .stale.<ts>)
              #          and re-clone from $EXPECTED_URL.
              #
              #   (c) Directory does not exist at all
              #       -> first-time deploy, clone fresh.
              #
              # A .git whose origin names a DIFFERENT repository is still
              # refused -- fetch+reset there would overwrite someone else's tree.
              # "Different" is decided by repository identity rather than by the
              # text of the URL (see same_repo_as_expected above), and a refusal
              # skips this site instead of ending the run, so the sites after it
              # still get the update. Dixlase/dixlase-core#519.
              # ------------------------------------------------------------------
              if [ -d "$DEST/.git" ]; then
                ACTUAL_URL=$(cd "$DEST" && git config --get remote.origin.url || echo "")
                RECORD_CANONICAL_URL=""
                if [ "$ACTUAL_URL" != "$EXPECTED_URL" ]; then
                  if same_repo_as_expected "$ACTUAL_URL"; then
                    echo "  origin names this repository another way; recording the canonical URL."
                    echo "    was:     $ACTUAL_URL"
                    echo "    becomes: $EXPECTED_URL"
                    RECORD_CANONICAL_URL=1
                  else
                    echo "ERROR: $DEST/.git origin names a different repository." >&2
                    echo "       Expected: $EXPECTED_URL" >&2
                    echo "       Actual:   $ACTUAL_URL" >&2
                    echo "       Refusing to fetch+reset against an unrelated repo." >&2
                    echo "       If this checkout IS this theme, point it at the right" >&2
                    echo "       remote and re-run the deploy -- nothing has to move:" >&2
                    echo "         git -C $DEST remote set-url origin $EXPECTED_URL" >&2
                    echo "       Only if it is not, park it OUTSIDE themes/ before" >&2
                    echo "       re-cloning. A copy left in themes/ is registered as a" >&2
                    echo "       second extension, and removing it later takes the whole" >&2
                    echo "       site down, not just this theme:" >&2
                    echo "         sudo mv $DEST $BACKUP_ROOT/$THEME_DIR.stale.\$(date +%Y%m%d-%H%M%S)" >&2
                    echo "         git clone --branch main $EXPECTED_URL $DEST" >&2
                    FAILED_SITES="$FAILED_SITES $SITE"
                    continue
                  fi
                fi

                if [ -n "$RECORD_CANONICAL_URL" ]; then
                  git -C "$DEST" remote set-url origin "$EXPECTED_URL"
                fi
                cd "$DEST"
                git fetch origin
                git reset --hard origin/main

              elif [ -d "$DEST" ]; then
                BACKUP="$BACKUP_ROOT/$THEME_DIR.stale.$(date +%Y%m%d-%H%M%S)"
                echo "WARNING: $DEST exists but has no nested .git; moving aside to $BACKUP and re-cloning fresh."
                # Diagnostics: this branch should fire once (the first deploy
                # after the theme's .git is lost), not on every run. If it
                # recurs, something between deploys removes the nested .git
                # and this log line is the evidence for tracking it down.
                echo "  Contents before move-aside: $(ls -A "$DEST" | wc -l) entr(ies); .git present: no"
                mv "$DEST" "$BACKUP"
                git clone --branch main "$EXPECTED_URL" "$DEST"

              else
                git clone --branch main "$EXPECTED_URL" "$DEST"
              fi

              # Keep at most STALE_KEEP move-aside copies per site. Each one is
              # a full ~1.5 MB tree, and core's dls:migration:resync globs
              # themes/* and reads theme.json from each, so every leftover
              # copy adds a duplicate `theme:<slug>` scope to that command
              # (see Src/Note/migration-resync-duplicate-scopes.md). Only
              # directories matching this theme's own .stale.<timestamp>
              # suffix are considered, newest kept first.
              # Sorted by the timestamp in the name, newest first. `ls -t`
              # would order by mtime, which `mv` carries over from the
              # original tree — so the copy made by this run can look older
              # than one made months ago and get pruned in its place.
              STALE_KEEP=1
              for OLD in $(ls -d "$BACKUP_ROOT/$THEME_DIR".stale.* 2>/dev/null | sort -r | tail -n +$((STALE_KEEP + 1))); do
                case "$OLD" in
                  "$BACKUP_ROOT/$THEME_DIR".stale.*)
                    echo "  Pruning old move-aside copy: $OLD"
                    rm -rf "$OLD"
                    ;;
                  *)
                    echo "  Refusing to prune unexpected path: $OLD" >&2
                    ;;
                esac
              done

              # The theme has no Composer dependencies (composer.json requires only
              # php and declares no autoload), so `composer install` here produced
              # nothing but vendor/ and composer.lock. Both sit outside the theme
              # signature, and signature verification counted them as extra files,
              # so the sites reported the theme as invalid. Remove the copies left
              # by earlier deploys instead of creating them.
              cd "$DEST"
              rm -rf "$DEST/vendor" "$DEST/composer.lock"

              # The build lives inside the theme tree, and the public path
              # points at it with a symlink.
              #
              # Core's arrangement is that `themes/<slug>/resources/assets`
              # IS the build output and `public/assets/themes/<slug>` is a
              # relative symlink to it -- created by `dls:theme:symlink` and
              # recreated by `PublicAssetRelinker` on every core update. The
              # theme's own `vite.config.js` agrees.
              #
              # Earlier revisions of this workflow wrote the build to the
              # public path as a real DIRECTORY and `rm -f`-ed the symlink to
              # make room, which gave that one path two writers and whichever
              # ran last won. The next core update relinked, deleted the real
              # directory and pointed at a stale build, and every theme
              # CSS/JS URL 404'd. The HTML's byte size was unchanged, so a
              # size-based health check passed while the site rendered
              # unstyled. See #61.
              #
              # The assets now arrive with the tree the fetch above brought,
              # so nothing copies them here. What earlier deploys left
              # behind is cleared instead: they wrote each build into this
              # directory while it was untracked, so the reset leaves those
              # files in place. The clean is scoped to this one directory
              # and removes only what git does not track.
              THEME_ASSETS="$DEST/resources/assets"
              if [ -d "$THEME_ASSETS" ]; then
                git -C "$DEST" clean -fd -- resources/assets
              fi

              # Relative form matches core's RelativeSymlink: from
              # public/assets/themes/, `../../..` is the site root. Created
              # here rather than left to the next core update so a fresh
              # deploy serves assets immediately. Replacing a real directory
              # that is sitting at this path is the one-time migration off
              # the old layout — by this point the build is already in the
              # theme tree, so there is nothing to lose.
              ASSET_LINK="$SITE_ROOT/public/assets/themes/$THEME_DIR"
              ASSET_LINK_TARGET="../../../themes/$THEME_DIR/resources/assets"
              mkdir -p "$(dirname "$ASSET_LINK")"
              if [ "$(readlink "$ASSET_LINK" 2>/dev/null)" != "$ASSET_LINK_TARGET" ]; then
                if [ -d "$ASSET_LINK" ] && [ ! -L "$ASSET_LINK" ]; then
                  echo "  Replacing real directory at $ASSET_LINK with the symlink core expects"
                  rm -rf "$ASSET_LINK"
                else
                  rm -f "$ASSET_LINK"
                fi
                ln -s "$ASSET_LINK_TARGET" "$ASSET_LINK"
                echo "  Linked $ASSET_LINK -> $ASSET_LINK_TARGET"
              fi

              # Invalidate Laravel's compiled bootstrap caches (views, config,
              # routes, events) so any blade / config / route changes shipped
              # by this push take effect on the next request without waiting
              # for OPcache revalidation or a PHP-FPM reload. Replaces the
              # previous view:clear-only call which left config/route caches
              # potentially stale.
              # Rebuild the site's generated autoload map before clearing the
              # caches. composer.local.json is generated from whatever
              # themes/ and plugins/ hold at that moment, so it can still
              # name a directory this run moved or pruned; composer requires
              # autoload.files entries unconditionally, which turns a stale
              # entry into a fatal on every request. Regenerating here keeps
              # the map in step with the tree we just deployed.
              if [ -f "$SITE_ROOT/scripts/sync-local-autoload.php" ]; then
                ( cd "$SITE_ROOT" \
                  && php scripts/sync-local-autoload.php \
                  && composer dump-autoload --no-scripts --no-interaction ) \
                  || { echo "ERROR: autoload regeneration failed for $SITE" >&2; exit 1; }
              fi

              docker exec $RUN_AS "$PHP_CONTAINER" php $APP_ROOT/artisan optimize:clear
            done

            # One site's bad checkout must not withhold the update from the
            # sites after it, so the loop records the refusal and carries on.
            # The job still fails, after every other site has been deployed.
            if [ -n "$FAILED_SITES" ]; then
              echo "ERROR: refused to deploy to:$FAILED_SITES" >&2
              echo "       Every site not listed here was deployed." >&2
              exit 1
            fi

            echo "=== Theme deploy complete ==="
