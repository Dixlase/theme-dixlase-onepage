name: Deploy Theme

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set deploy target
        id: target
        run: |
          if [ "${{ github.repository }}" = "Dixlase/theme-dixlase-onepage" ]; then
            echo "env=production" >> $GITHUB_OUTPUT
            echo "base_dir=/srv/dixlase" >> $GITHUB_OUTPUT
          else
            echo "env=staging" >> $GITHUB_OUTPUT
            echo "base_dir=/srv/dixlase/staging" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Build frontend assets
        run: |
          npm ci --no-audit --no-fund
          NODE_ENV=production npx vite build --outDir dist

      - name: Create shared build directory on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: mkdir -p ${{ steps.target.outputs.base_dir }}/_shared/themes/DixlaseOnePage

      - name: Deploy built assets via rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete
          path: dist/
          remote_path: ${{ steps.target.outputs.base_dir }}/_shared/themes/DixlaseOnePage/
          remote_host: ${{ secrets.SERVER_HOST }}
          remote_user: ${{ secrets.SERVER_USER }}
          remote_key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Deploy theme via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            BASE="${{ steps.target.outputs.base_dir }}"
            THEME_DIR="DixlaseOnePage"
            EXPECTED_URL="git@github.com:${{ github.repository }}.git"

            for SITE in brand docs keys; do
              DEST="$BASE/$SITE/themes/$THEME_DIR"
              echo "=== Deploying theme $THEME_DIR to $SITE (${{ steps.target.outputs.env }}) ==="

              # themes ディレクトリがなければ作成
              mkdir -p "$BASE/$SITE/themes"

              # ------------------------------------------------------------------
              # Resolve $DEST into one of three shapes and act accordingly:
              #
              #   (a) Proper nested clone of this theme
              #       -> fetch + reset to origin/main
              #
              #   (b) Directory exists but with no nested .git
              #       -> likely the outer parent repo was re-cloned over it and
              #          the theme's git metadata was lost. Without this guard
              #          the next branch would silently fetch+reset against
              #          WHICHEVER repo the parent .git tracks (Core, usually),
              #          leaving theme files frozen forever -- same silent
              #          regression that hid in DixlaseInquiry from
              #          2026-05-13 to 2026-05-17.
              #          Move the stale tree aside (recoverable as .stale.<ts>)
              #          and re-clone from $EXPECTED_URL.
              #
              #   (c) Directory does not exist at all
              #       -> first-time deploy, clone fresh.
              #
              # Any other anomaly (.git exists but its origin URL points at a
              # different repo) is treated as operator intent we shouldn't
              # second-guess: fail loud so manual recovery is forced.
              # ------------------------------------------------------------------
              if [ -d "$DEST/.git" ]; then
                ACTUAL_URL=$(cd "$DEST" && git config --get remote.origin.url || echo "")
                if [ "$ACTUAL_URL" != "$EXPECTED_URL" ]; then
                  echo "ERROR: $DEST/.git origin URL does not match this theme." >&2
                  echo "       Expected: $EXPECTED_URL" >&2
                  echo "       Actual:   $ACTUAL_URL" >&2
                  echo "       Refusing to fetch+reset against an unrelated repo." >&2
                  echo "       Manual recovery (one-time):" >&2
                  echo "         sudo mv $DEST ${DEST}.stale.\$(date +%Y%m%d-%H%M%S)" >&2
                  echo "         git clone --branch main $EXPECTED_URL $DEST" >&2
                  exit 1
                fi

                cd "$DEST"
                git fetch origin
                git reset --hard origin/main

              elif [ -d "$DEST" ]; then
                BACKUP="${DEST}.stale.$(date +%Y%m%d-%H%M%S)"
                echo "WARNING: $DEST exists but has no nested .git; moving aside to $BACKUP and re-cloning fresh."
                mv "$DEST" "$BACKUP"
                git clone --branch main "$EXPECTED_URL" "$DEST"

              else
                git clone --branch main "$EXPECTED_URL" "$DEST"
              fi

              if [ -f "$DEST/composer.json" ]; then
                cd "$DEST"
                composer install --no-dev --no-interaction --optimize-autoloader
              fi

              # CIでビルド済みのフロントエンドアセットをコピー
              # theme installer は dev 用に
              #   public/assets/themes/DixlaseOnePage → themes/DixlaseOnePage/resources/assets
              # の symlink を張ることがあり、その場合 `mkdir -p` がパスに非ディレクトリ
              # (symlink) を見つけて失敗する。symlink や通常ファイルが居座っていれば
              # 取り除いてから新規ディレクトリを掘り直す。
              ASSET_DIR="$BASE/$SITE/public/assets/themes/$THEME_DIR"
              if [ -L "$ASSET_DIR" ] || { [ -e "$ASSET_DIR" ] && [ ! -d "$ASSET_DIR" ]; }; then
                rm -f "$ASSET_DIR"
              fi
              mkdir -p "$ASSET_DIR"
              rsync -a "$BASE/_shared/themes/$THEME_DIR/" "$ASSET_DIR/"

              # Invalidate Laravel's compiled bootstrap caches (views, config,
              # routes, events) so any blade / config / route changes shipped
              # by this push take effect on the next request without waiting
              # for OPcache revalidation or a PHP-FPM reload. Replaces the
              # previous view:clear-only call which left config/route caches
              # potentially stale.
              docker exec compose-php-1 php /var/www/apps/$SITE/artisan optimize:clear
            done

            echo "=== Theme deploy complete ==="
