name: Deploy Theme

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Order-critical: core → theme (see the same note in release.yml).
      # actions/checkout cleans its target before extracting, so the
      # inverse order would wipe the theme subtree that setup-node
      # then needs for its npm cache lookup and that vite needs for
      # the build itself.
      - name: Checkout dixlase-core (for CSS @import + components @source)
        # Only needed for:
        #   resources/src/common/css/                    (`@import` target)
        #   resources/views/components/**/*.blade.php    (`@source` for core shared components)
        #   resources/src/components/**/*.js             (`@source` for core shared components)
        # See release.yml for the full rationale — this deploy runner
        # is standalone-checkout too (no plugins/ siblings) and hits
        # the same cross-repo `@import` failure without core present.
        uses: actions/checkout@v5
        with:
          repository: Dixlase/dixlase-core
          ref: main
          token: ${{ secrets.CORE_REPO_TOKEN }}
          path: dixlase-ctx

      - name: Checkout theme code
        uses: actions/checkout@v5
        with:
          path: dixlase-ctx/themes/DixlaseOnePage

      # Check out every plugin the theme's `tailwind.css` scans via a
      # hardcoded `@source "…/plugins/<Plugin>/resources/views"` line.
      # Without these, the runner tree lacks the plugin view files,
      # Tailwind's scanner (correctly) reports 0 matches for each
      # plugin, and the emitted CSS drops every utility used only by
      # plugin views (`bg-gray-900`, `border-gray-400`, `col-span-2`,
      # form-focus / disabled variants, etc.) — ~140 classes at time
      # of writing. The site still renders the *theme's* own views
      # but breaks anywhere a plugin view or `custom/` override needs
      # one of those utilities. This is the same problem PR #14 left
      # unresolved (see #14's discussion + the follow-up in the
      # `extension-update-prebuilt-assets-no-npm` backlog).
      #
      # Each checkout targets `main`; the theme's `@source` never pins
      # a tag. If per-tag builds ever become necessary, revisit this
      # block and thread the tag through inputs / secrets.
      - name: Checkout plugin — DixlaseBlog
        uses: actions/checkout@v5
        with:
          repository: Dixlase/plugin-dixlase-blog
          ref: main
          token: ${{ secrets.CORE_REPO_TOKEN }}
          path: dixlase-ctx/plugins/DixlaseBlog

      - name: Checkout plugin — DixlaseCookie
        uses: actions/checkout@v5
        with:
          repository: Dixlase/plugin-dixlase-cookie
          ref: main
          token: ${{ secrets.CORE_REPO_TOKEN }}
          path: dixlase-ctx/plugins/DixlaseCookie

      - name: Checkout plugin — DixlaseCoreDevKit
        uses: actions/checkout@v5
        with:
          repository: Dixlase/plugin-dixlase-core-devkit
          ref: main
          token: ${{ secrets.CORE_REPO_TOKEN }}
          path: dixlase-ctx/plugins/DixlaseCoreDevKit

      - name: Checkout plugin — DixlaseDeploy
        uses: actions/checkout@v5
        with:
          repository: Dixlase/plugin-dixlase-deploy
          ref: main
          token: ${{ secrets.CORE_REPO_TOKEN }}
          path: dixlase-ctx/plugins/DixlaseDeploy

      - name: Checkout plugin — DixlaseInquiry
        uses: actions/checkout@v5
        with:
          repository: Dixlase/plugin-dixlase-inquiry
          ref: main
          token: ${{ secrets.CORE_REPO_TOKEN }}
          path: dixlase-ctx/plugins/DixlaseInquiry

      - name: Checkout plugin — DixlaseLegal
        uses: actions/checkout@v5
        with:
          repository: Dixlase/plugin-dixlase-legal
          ref: main
          token: ${{ secrets.CORE_REPO_TOKEN }}
          path: dixlase-ctx/plugins/DixlaseLegal

      - name: Checkout plugin — DixlaseMenus
        uses: actions/checkout@v5
        with:
          repository: Dixlase/plugin-dixlase-menus
          ref: main
          token: ${{ secrets.CORE_REPO_TOKEN }}
          path: dixlase-ctx/plugins/DixlaseMenus

      - name: Checkout plugin — DixlaseMultilingual
        uses: actions/checkout@v5
        with:
          repository: Dixlase/plugin-dixlase-multilingual
          ref: main
          token: ${{ secrets.CORE_REPO_TOKEN }}
          path: dixlase-ctx/plugins/DixlaseMultilingual

      - name: Checkout plugin — DixlasePages
        uses: actions/checkout@v5
        with:
          repository: Dixlase/plugin-dixlase-pages
          ref: main
          token: ${{ secrets.CORE_REPO_TOKEN }}
          path: dixlase-ctx/plugins/DixlasePages

      - name: Checkout plugin — DixlaseSEO
        uses: actions/checkout@v5
        with:
          repository: Dixlase/plugin-dixlase-seo
          ref: main
          token: ${{ secrets.CORE_REPO_TOKEN }}
          path: dixlase-ctx/plugins/DixlaseSEO

      - name: Set deploy target
        id: target
        run: |
          if [ "${{ github.repository }}" = "Dixlase/theme-dixlase-onepage" ]; then
            echo "env=production" >> $GITHUB_OUTPUT
            echo "base_dir=/srv/dixlase" >> $GITHUB_OUTPUT
          else
            echo "env=staging" >> $GITHUB_OUTPUT
            echo "base_dir=/srv/dixlase/staging" >> $GITHUB_OUTPUT
          fi

      - name: Seed empty Tailwind plugin-sources stub
        # Same trick release.yml uses (which itself mirrors
        # dixlase-core release.yml). Runtime, `php artisan
        # dls:tailwind:regenerate-plugin-sources` writes this file
        # based on enabled plugins; in CI we do not install any
        # plugin, so we write the empty form the runtime aggregator
        # would produce on a fresh install. `theme/tailwind.css`
        # `@import`s this path — the file must exist for `vite build`
        # to succeed.
        run: |
          cat > "dixlase-ctx/resources/src/common/css/dixlase-tailwind-plugin-sources.css" <<'CSS'
          /*
           * Empty stub emitted by theme deploy CI. Same shape as
           * `php artisan dls:tailwind:regenerate-plugin-sources`
           * produces on a fresh install with no plugin enabled.
           */
          /* No enabled plugin currently declares Tailwind content sources. */
          CSS

      - name: Ensure optional scan paths exist
        # `theme/tailwind.css` has a bare-dir `@source` for
        # `storage/app/private/core/front/`. Tailwind silently skips
        # missing paths but we `mkdir -p` so the scan output is
        # clean.
        run: |
          mkdir -p "dixlase-ctx/storage/app/private/core/front"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dixlase-ctx/themes/DixlaseOnePage/package-lock.json

      - name: Build frontend assets
        # `--outDir` written as an absolute path so it lands back at
        # the workspace root regardless of the working-directory
        # switch — the rsync step downstream still uploads `dist/`
        # from the workspace root.
        working-directory: dixlase-ctx/themes/DixlaseOnePage
        run: |
          npm ci --no-audit --no-fund
          NODE_ENV=production npx vite build --outDir "$GITHUB_WORKSPACE/dist"

      - name: Create shared build directory on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: mkdir -p ${{ steps.target.outputs.base_dir }}/_shared/themes/DixlaseOnePage

      - name: Deploy built assets via rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete
          path: dist/
          remote_path: ${{ steps.target.outputs.base_dir }}/_shared/themes/DixlaseOnePage/
          remote_host: ${{ secrets.SERVER_HOST }}
          remote_user: ${{ secrets.SERVER_USER }}
          remote_key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Deploy theme via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            BASE="${{ steps.target.outputs.base_dir }}"
            THEME_DIR="DixlaseOnePage"
            EXPECTED_URL="git@github.com:${{ github.repository }}.git"

            # `keys` was renamed to `authority` (https://authority.dixlase.net/);
            # /var/www/apps/keys no longer exists in compose-php-1.
            for SITE in brand docs demo authority; do
              # Resolve the site layout. A Docker Installer instance keeps the app in
              # $BASE/$SITE/html and runs its own PHP container named after
              # CONTAINER_PREFIX in $BASE/$SITE/.env, with files owned by
              # deploy:www-data. The legacy shared stack mounts $BASE/$SITE into
              # compose-php-1 at /var/www/apps/$SITE, owned by deploy:deploy.
              if [ -f "$BASE/$SITE/docker-compose.yml" ] && [ -d "$BASE/$SITE/html" ]; then
                SITE_ROOT="$BASE/$SITE/html"
                APP_ROOT="/var/www/html"
                PREFIX=$(grep -E '^CONTAINER_PREFIX=' "$BASE/$SITE/.env" 2>/dev/null | cut -d= -f2)
                PHP_CONTAINER="${PREFIX:-dixlase-$SITE}-app"
                OWNER="1001:33"
                RUN_AS="-u www-data"
                # The installer keeps dev packages in vendor/, so an autoload map
                # built with --no-dev drops their service providers and every request
                # then fails in package discovery.
                NO_DEV=""
              else
                SITE_ROOT="$BASE/$SITE"
                APP_ROOT="/var/www/apps/$SITE"
                PHP_CONTAINER="compose-php-1"
                OWNER="1001:1001"
                RUN_AS=""
                NO_DEV="--no-dev"
              fi
              # Installer sites need group write too: www-data writes caches and the
              # deploy user's next rsync must be able to replace what it wrote.
              fix_owner() {
                docker exec "$PHP_CONTAINER" chown -R "$OWNER" "$@"
                if [ -n "$RUN_AS" ]; then docker exec "$PHP_CONTAINER" chmod -R g+rwX "$@"; fi
              }
              DEST="$SITE_ROOT/themes/$THEME_DIR"
              echo "=== Deploying theme $THEME_DIR to $SITE (${{ steps.target.outputs.env }}) ==="

              # Skip a site that is not set up (renamed, retired, or not yet
              # bind-mounted). Without this, a rename turns every later run
              # red at the artisan call and hides real failures — which is
              # exactly what `keys` did from 2026-09-16 on. Mirrors the same
              # guard in dixlase-core's deploy.yml.
              if [ ! -d "$SITE_ROOT" ]; then
                echo "  SKIP: host path $BASE/$SITE does not exist"
                continue
              fi
              if ! docker exec "$PHP_CONTAINER" test -f "$APP_ROOT/artisan"; then
                echo "  SKIP: $APP_ROOT/artisan not found in $PHP_CONTAINER"
                continue
              fi

              # themes ディレクトリがなければ作成
              mkdir -p "$SITE_ROOT/themes"

              # Move-aside copies must NOT live under themes/. The site's
              # scripts/sync-local-autoload.php globs themes/* and registers
              # every match as a theme, so a copy parked there gets its own
              # PSR-4 roots AND an autoload.files entry for its helper file.
              # Deleting such a copy then makes composer require() a file that
              # no longer exists — a fatal on every request and every artisan
              # call, not a degraded theme. Park them outside the glob instead,
              # and migrate any copy an older revision of this workflow left
              # behind so the next deploy self-heals.
              BACKUP_ROOT="$SITE_ROOT/.theme-backups"
              mkdir -p "$BACKUP_ROOT"
              for LEGACY in "$SITE_ROOT/themes/$THEME_DIR".stale.*; do
                [ -d "$LEGACY" ] || continue
                echo "  Migrating legacy copy out of themes/: $LEGACY"
                mv "$LEGACY" "$BACKUP_ROOT/$(basename "$LEGACY")"
              done

              # ------------------------------------------------------------------
              # Resolve $DEST into one of three shapes and act accordingly:
              #
              #   (a) Proper nested clone of this theme
              #       -> fetch + reset to origin/main
              #
              #   (b) Directory exists but with no nested .git
              #       -> likely the outer parent repo was re-cloned over it and
              #          the theme's git metadata was lost. Without this guard
              #          the next branch would silently fetch+reset against
              #          WHICHEVER repo the parent .git tracks (Core, usually),
              #          leaving theme files frozen forever -- same silent
              #          regression that hid in DixlaseInquiry from
              #          2026-05-13 to 2026-05-17.
              #          Move the stale tree aside (recoverable as .stale.<ts>)
              #          and re-clone from $EXPECTED_URL.
              #
              #   (c) Directory does not exist at all
              #       -> first-time deploy, clone fresh.
              #
              # Any other anomaly (.git exists but its origin URL points at a
              # different repo) is treated as operator intent we shouldn't
              # second-guess: fail loud so manual recovery is forced.
              # ------------------------------------------------------------------
              if [ -d "$DEST/.git" ]; then
                ACTUAL_URL=$(cd "$DEST" && git config --get remote.origin.url || echo "")
                if [ "$ACTUAL_URL" != "$EXPECTED_URL" ]; then
                  echo "ERROR: $DEST/.git origin URL does not match this theme." >&2
                  echo "       Expected: $EXPECTED_URL" >&2
                  echo "       Actual:   $ACTUAL_URL" >&2
                  echo "       Refusing to fetch+reset against an unrelated repo." >&2
                  echo "       Manual recovery (one-time):" >&2
                  echo "         sudo mv $DEST ${DEST}.stale.\$(date +%Y%m%d-%H%M%S)" >&2
                  echo "         git clone --branch main $EXPECTED_URL $DEST" >&2
                  exit 1
                fi

                cd "$DEST"
                git fetch origin
                git reset --hard origin/main

              elif [ -d "$DEST" ]; then
                BACKUP="$BACKUP_ROOT/$THEME_DIR.stale.$(date +%Y%m%d-%H%M%S)"
                echo "WARNING: $DEST exists but has no nested .git; moving aside to $BACKUP and re-cloning fresh."
                # Diagnostics: this branch should fire once (the first deploy
                # after the theme's .git is lost), not on every run. If it
                # recurs, something between deploys removes the nested .git
                # and this log line is the evidence for tracking it down.
                echo "  Contents before move-aside: $(ls -A "$DEST" | wc -l) entr(ies); .git present: no"
                mv "$DEST" "$BACKUP"
                git clone --branch main "$EXPECTED_URL" "$DEST"

              else
                git clone --branch main "$EXPECTED_URL" "$DEST"
              fi

              # Keep at most STALE_KEEP move-aside copies per site. Each one is
              # a full ~1.5 MB tree, and core's dls:migration:resync globs
              # themes/* and reads theme.json from each, so every leftover
              # copy adds a duplicate `theme:<slug>` scope to that command
              # (see Src/Note/migration-resync-duplicate-scopes.md). Only
              # directories matching this theme's own .stale.<timestamp>
              # suffix are considered, newest kept first.
              # Sorted by the timestamp in the name, newest first. `ls -t`
              # would order by mtime, which `mv` carries over from the
              # original tree — so the copy made by this run can look older
              # than one made months ago and get pruned in its place.
              STALE_KEEP=1
              for OLD in $(ls -d "$BACKUP_ROOT/$THEME_DIR".stale.* 2>/dev/null | sort -r | tail -n +$((STALE_KEEP + 1))); do
                case "$OLD" in
                  "$BACKUP_ROOT/$THEME_DIR".stale.*)
                    echo "  Pruning old move-aside copy: $OLD"
                    rm -rf "$OLD"
                    ;;
                  *)
                    echo "  Refusing to prune unexpected path: $OLD" >&2
                    ;;
                esac
              done

              # The theme has no Composer dependencies (composer.json requires only
              # php and declares no autoload), so `composer install` here produced
              # nothing but vendor/ and composer.lock. Both sit outside the theme
              # signature, and signature verification counted them as extra files,
              # so the sites reported the theme as invalid. Remove the copies left
              # by earlier deploys instead of creating them.
              cd "$DEST"
              rm -rf "$DEST/vendor" "$DEST/composer.lock"

              # CIでビルド済みのフロントエンドアセットをコピー
              # theme installer は dev 用に
              #   public/assets/themes/DixlaseOnePage → themes/DixlaseOnePage/resources/assets
              # の symlink を張ることがあり、その場合 `mkdir -p` がパスに非ディレクトリ
              # (symlink) を見つけて失敗する。symlink や通常ファイルが居座っていれば
              # 取り除いてから新規ディレクトリを掘り直す。
              ASSET_DIR="$SITE_ROOT/public/assets/themes/$THEME_DIR"
              if [ -L "$ASSET_DIR" ] || { [ -e "$ASSET_DIR" ] && [ ! -d "$ASSET_DIR" ]; }; then
                rm -f "$ASSET_DIR"
              fi
              mkdir -p "$ASSET_DIR"
              rsync -a "$BASE/_shared/themes/$THEME_DIR/" "$ASSET_DIR/"

              # Sweep stale build artefacts. Vite content-hashes JS/CSS
              # entry filenames so every build's URLs are unique; without
              # this sweep, `rsync -a` (no --delete) leaves every prior
              # build's files stacked in the asset dir forever. Files
              # from the pre-hash era (bare `style.css` / `tailwind.css`
              # / `app.js`) also get collected here on the first run.
              #
              # `manifest.json` is the source of truth for what the
              # newly-compiled views will actually reference — anything
              # under css/ / js/ / fonts/ / images/ / assets/ that
              # isn't listed there is unreachable dead weight and gets
              # removed. Trade-off: a browser holding STALE HTML that
              # references an old hashed URL will 404 on that asset
              # after this runs, until the next navigation re-fetches
              # the HTML. HTML is served without Cache-Control so that
              # window is short; the alternative (never cleaning up)
              # leaks disk space and hides audit surface behind noise.
              #
              # Blanket `rsync --delete` would achieve the same effect
              # but hides the intent behind an option flag. Keeping
              # this as an explicit sweep documents WHY files get
              # removed for anyone reading the deploy log.
              MANIFEST="$ASSET_DIR/manifest.json"
              if [ -f "$MANIFEST" ]; then
                KEEP_LIST=$(mktemp)
                grep -oE '"file"[[:space:]]*:[[:space:]]*"[^"]+"' "$MANIFEST" \
                  | sed -E 's/.*"file"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/' \
                  | sort -u > "$KEEP_LIST"
                echo "manifest.json" >> "$KEEP_LIST"

                REMOVED=0
                for SUBDIR in css js fonts images assets; do
                  DIR="$ASSET_DIR/$SUBDIR"
                  [ -d "$DIR" ] || continue
                  while IFS= read -r -d '' F; do
                    REL="${F#$ASSET_DIR/}"
                    if ! grep -qxF "$REL" "$KEEP_LIST"; then
                      rm -f "$F"
                      REMOVED=$((REMOVED + 1))
                    fi
                  done < <(find "$DIR" -type f -print0)
                done
                rm -f "$KEEP_LIST"
                echo "Stale-asset sweep: removed $REMOVED file(s) not present in manifest.json"
              fi

              # Invalidate Laravel's compiled bootstrap caches (views, config,
              # routes, events) so any blade / config / route changes shipped
              # by this push take effect on the next request without waiting
              # for OPcache revalidation or a PHP-FPM reload. Replaces the
              # previous view:clear-only call which left config/route caches
              # potentially stale.
              # Rebuild the site's generated autoload map before clearing the
              # caches. composer.local.json is generated from whatever
              # themes/ and plugins/ hold at that moment, so it can still
              # name a directory this run moved or pruned; composer requires
              # autoload.files entries unconditionally, which turns a stale
              # entry into a fatal on every request. Regenerating here keeps
              # the map in step with the tree we just deployed.
              if [ -f "$SITE_ROOT/scripts/sync-local-autoload.php" ]; then
                ( cd "$SITE_ROOT" \
                  && php scripts/sync-local-autoload.php \
                  && composer dump-autoload --no-scripts --no-interaction ) \
                  || { echo "ERROR: autoload regeneration failed for $SITE" >&2; exit 1; }
              fi

              docker exec $RUN_AS "$PHP_CONTAINER" php $APP_ROOT/artisan optimize:clear
            done

            echo "=== Theme deploy complete ==="
