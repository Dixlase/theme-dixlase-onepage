name: Deploy Theme

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set deploy target
        id: target
        run: |
          if [ "${{ github.repository }}" = "Dixlase/theme-dixlase-onepage" ]; then
            echo "env=production" >> $GITHUB_OUTPUT
            echo "base_dir=/srv/dixlase" >> $GITHUB_OUTPUT
          else
            echo "env=staging" >> $GITHUB_OUTPUT
            echo "base_dir=/srv/dixlase/staging" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Build frontend assets
        run: |
          mkdir -p ../../public/assets/themes/DixlaseOnePage
          npm ci --no-audit --no-fund
          npm run build
        env:
          NODE_ENV: production

      - name: Create shared build directory on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: mkdir -p ${{ steps.target.outputs.base_dir }}/_shared/themes/DixlaseOnePage

      - name: Deploy built assets via rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete
          path: ../../public/assets/themes/DixlaseOnePage/
          remote_path: ${{ steps.target.outputs.base_dir }}/_shared/themes/DixlaseOnePage/
          remote_host: ${{ secrets.SERVER_HOST }}
          remote_user: ${{ secrets.SERVER_USER }}
          remote_key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Deploy theme via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            BASE="${{ steps.target.outputs.base_dir }}"
            THEME_DIR="DixlaseOnePage"

            for SITE in brand docs demo keys; do
              DEST="$BASE/$SITE/themes/$THEME_DIR"
              echo "=== Deploying theme $THEME_DIR to $SITE (${{ steps.target.outputs.env }}) ==="

              if [ ! -d "$DEST" ]; then
                git clone --branch main git@github.com:${{ github.repository }}.git "$DEST"
              else
                cd "$DEST"
                git fetch origin
                git reset --hard origin/main
              fi

              if [ -f "$DEST/composer.json" ]; then
                cd "$DEST"
                composer install --no-dev --no-interaction --optimize-autoloader
              fi

              # CIでビルド済みのフロントエンドアセットをコピー
              mkdir -p "$BASE/$SITE/public/assets/themes/$THEME_DIR"
              rsync -a "$BASE/_shared/themes/$THEME_DIR/" "$BASE/$SITE/public/assets/themes/$THEME_DIR/"

              # キャッシュクリア（コンテナ内で実行）
              docker exec compose-php-1 php /var/www/apps/$SITE/artisan view:clear
              docker exec compose-php-1 php /var/www/apps/$SITE/artisan cache:clear
            done

            echo "=== Theme deploy complete ==="
